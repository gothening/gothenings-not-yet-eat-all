plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.184'
}

group = 'com.gothening'
version = mod_version

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenLocal()
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    compileOnly files('libs/refinedstorage-neoforge-2.0.8.jar')
    compileOnly files('libs/appliedenergistics2-19.2.17.jar')
    compileOnly files('libs/sophisticatedbackpacks-1.21.1-3.25.73.2027.jar')
    compileOnly files('libs/sophisticatedcore-1.21.1-1.4.84.2248.jar')
    compileOnly files('libs/sophisticatedstorage-1.21.1-1.5.85.2077.jar')
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        neo_version_range: neo_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = 'file://' + System.getenv('local_maven') ?: "$buildDir/repository"
        }
    }
}
